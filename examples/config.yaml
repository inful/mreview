# mreview configuration.
#
# Load this file with:
#     mreview --config=/etc/mreview/config.yaml review --repo=... --mr=...
#
# mreview also looks for this file at the default location
# ~/.config/mreview/config.yaml when --config (and MREVIEW_CONFIG)
# are unset.
#
# Behavior:
#   - Values from this file populate env vars before flag parsing.
#   - CLI flags always win over config values.
#   - Secret fields (token_env, etc.) reference env-var NAMES —
#     never store the secret itself in this file. The loader
#     copies the value from the named env var into the env var
#     the CLI flag expects (GITLAB_TOKEN, etc.) so the existing
#     env:"" tag wiring keeps working.
#
# Schema mirrors every flag in `mreview review --help`. The
# architecture reset (#42) collapsed the old `llm:` / `review:`
# fields; only the post-reset surface is documented here.
# `llm_presets` / `llm_preset_by_model` are kept as a deprecated
# stub so existing configs keep parsing — see the trailing block.

gitlab:
  # Base URL for the GitLab API. For self-hosted GitLab, point at
  # your instance's /api/v4 root.
  url: https://gitlab.com

  # The token itself is NEVER stored in this file. Set GITLAB_TOKEN
  # in the environment, or pass --gitlab-token at runtime.
  #
  # Required scope: api (full read/write).
  token_env: GITLAB_TOKEN

provider:
  # Provider base URL. Required for litellm / local; ignored for
  # hosted providers. The harness library owns the wire format.
  #   - Anthropic:        (hosted, no base URL needed)
  #   - OpenAI:           (hosted, no base URL needed)
  #   - Gemini:           (hosted, no base URL needed)
  #   - LiteLLM proxy:    http://your-litellm:4000/v1
  #   - OpenRouter:       (hosted, no base URL needed)
  #   - Local (Ollama):   http://localhost:11434/v1
  base_url: http://localhost:11434/v1

  # Model name. Must be available on the provider
  # (verify with `mreview doctor`).
  model: qwen2.5-coder:7b

review:
  # Bot username for the dedupe layer. When set, only the bot's
  # prior comments count toward the dedup baseline; human
  # comments are ignored. When empty, every existing comment is
  # treated as a duplicate candidate (more conservative).
  bot_username_env: GITLAB_BOT_USERNAME

retry:
  # GitLab API retry policy (transient errors only).
  max_attempts: 4       # --retries + 1
  initial_backoff: 500ms # --retry-backoff
  max_backoff: 30s

# Skills (issue #44): team-authored review guidance the agent
# reads on demand. Two layers — a bundled set ships with every
# release (see internal/skills/bundled/), and an optional
# central repo augments them with team-authored .md files.
# The central repo wins on name collision, so a team can
# patch any bundled skill by putting a same-named .md here.
#
# Each skill is one .md file under <repo>/<directory>/. The
# loader reads the YAML `description:` frontmatter field as the
# value that surfaces in mcp__skills__list_skills; bodies are
# passed to the agent verbatim when read_skill is called.
#
# Disabled when `repo_path` is absent — only the bundled set
# applies, with no surprise outbound calls against a public
# GitLab repo.
#
# skills:
#   repo_path: inful/mreview-skills    # group/project (required to enable)
#   directory: skills                  # default
#   ref: main                          # default; pin a SHA for reproducibility
#   token_env: GITLAB_TOKEN            # default; reuse the review token

# ─── DEPRECATED ────────────────────────────────────────────────────
# `llm_presets` / `llm_preset_by_model` were the hand-rolled
# LLM-loop's mechanism for deriving packing budgets. After the
# architecture reset (#42), the harness library owns prompt-cache
# discipline and the provider matrix. The preset layer is kept
# as a stub so existing YAML configs keep parsing, but it's no
# longer used to size the work. The harness library's own preset
# layer will replace it.
#
# Existing block, retained verbatim for compatibility:
#
# llm_presets:
#   opus-local:
#     context_window: 168000
#     per_chunk_timeout: 15m
#   o-series:
#     context_window: 200000
#     per_chunk_timeout: 15m
#     reasoning_effort: high
#   coding-agent:
#     context_window: 168000
#     per_chunk_timeout: 5m
#     max_batch_bytes: 3000
#
# llm_preset_by_model:
#   "qwen2.5-coder:7b": opus-local
#   "o3-mini":          o-series
#   "coding-agent":     coding-agent