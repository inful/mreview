# GitLab CI integration for `mreview review`
#
# Drop this snippet into your project's `.gitlab-ci.yml` to
# trigger an `mreview review` on every MR open / reopen /
# push event. This is the right integration for teams that
# prefer CI-driven review over a long-running `mreview
# serve` process.
#
# Architecture (per #42, architecture reset):
#
#   - Stage 1 runs the CI producer stages in parallel:
#       go-build   → .mreview-artifacts/build.log
#       go-test    → .mreview-artifacts/test_results.json
#       golangci-lint → .mreview-artifacts/lint.json
#       govulncheck → .mreview-artifacts/vulns.json
#     Each stage produces an artifact that mreview reads at
#     startup. The agent never re-runs these tools (it has no
#     shell access; the tools are read-only by contract).
#
#   - Stage 2 runs mreview. It reads the artifacts from
#     Stage 1, fetches the MR from GitLab, and asks the
#     harness agent to produce inline + summary findings.
#
#   - The tokensave MCP server indexes the repo's code
#     graph before the harness runs (one-shot; the
#     subprocess is spawned by the harness library).
#
# Authentication: the job uses a Personal Access Token via
# the GITLAB_TOKEN_CI variable (Project → Settings → CI/CD
# → Variables, masked, protected, `api` scope).

stages:
  - build
  - test
  - lint
  - vulns
  - index
  - ca-bundle
  - review

variables:
  # The single artifacts directory mreview reads from.
  MREVIEW_ARTIFACTS_DIR: .mreview-artifacts
  # Operator-tunable. Tokensave's sync is incremental after
  # the first run; on a cold cache it can take 1–3 min for
  # a large repo.
  TOKENSAVE_DB: .tokensave

# ─── Stage 1: producer stages (run in parallel) ──────────────
# Each producer writes one artifact. The `tee` / `|| true`
# pattern lets the producer stage succeed (exit 0) even when
# its tool reports a problem — the failure signal lives in
# the artifact, which mreview reads at startup. mreview's
# review-status exit code is independent of any individual
# producer's exit code.

go-build:
  stage: build
  image: golang:1.26
  script:
    - mkdir -p "$MREVIEW_ARTIFACTS_DIR"
    - go build ./... 2>&1 | tee "$MREVIEW_ARTIFACTS_DIR/build.log"
  artifacts:
    paths:
      - .mreview-artifacts/build.log
    expire_in: 1 hour

go-test:
  stage: test
  image: golang:1.26
  script:
    - mkdir -p "$MREVIEW_ARTIFACTS_DIR"
    - go test -json -race -count=1 ./... > "$MREVIEW_ARTIFACTS_DIR/test_results.json" 2>&1 || true
  artifacts:
    paths:
      - .mreview-artifacts/test_results.json
    expire_in: 1 hour

golangci-lint:
  stage: lint
  image: golangci/golangci-lint:latest
  script:
    - mkdir -p "$MREVIEW_ARTIFACTS_DIR"
    - golangci-lint run --out-format=json ./... > "$MREVIEW_ARTIFACTS_DIR/lint.json" 2>&1 || true
  artifacts:
    paths:
      - .mreview-artifacts/lint.json
    expire_in: 1 hour

govulncheck:
  stage: vulns
  image: golang:1.26
  script:
    - mkdir -p "$MREVIEW_ARTIFACTS_DIR"
    - go install golang.org/x/vuln/cmd/govulncheck@latest
    - govulncheck ./... > "$MREVIEW_ARTIFACTS_DIR/vulns.json" 2>&1 || true
  artifacts:
    paths:
      - .mreview-artifacts/vulns.json
    expire_in: 1 hour

# ─── Stage 1.5: tokensave sync ─────────────────────────────────
# One-shot indexing. The MCP server itself is spawned
# inside mreview's runtime — this stage just primes the
# cache so the agent's first code-graph query is fast.
#
# Image pin MUST match the version bundled in the mreview
# Docker image (see Dockerfile ARG block). Mismatched
# versions work today (the sync DB format is stable) but
# the contract is "everything below is one tokensave
# version" — drift between the sync image and the runtime
# MCP binary risks subtle index compatibility bugs. When
# you bump one, bump both.
tokensave-sync:
  stage: index
  image: ghcr.io/aovestdipaperino/tokensave:7.12.1
  script:
    - tokensave sync --project-root "$CI_PROJECT_DIR" --db "$TOKENSAVE_DB"
  cache:
    key: tokensave-$CI_COMMIT_REF_SLUG
    paths:
      - .tokensave

# ─── Stage 1.6: custom CA bundle (optional) ──────────────────
# When the team operates behind a corporate proxy or hosts
# the GitLab instance / LLM provider on a private CA, the
# mreview process needs the custom CA bundle to verify TLS
# for those services. This stage downloads the bundle from
# a known internal URL and exposes it to the mreview job
# as a CI artifact.
#
# Why a separate stage (not a before_script in the mreview
# job): the mreview image is distroless (`gcr.io/distroless/cc:*`)
# and has no curl / wget — only the binary + busybox shell
# in the debug variant. We use a separate image that DOES
# have curl (alpine via curlimages/curl) to fetch the bundle,
# then pass it to the mreview job via the standard CI
# artifact flow. The mreview job's before_script then
# concatenates the bundle with the system CAs and exports
# SSL_CERT_FILE (read by Go's crypto/x509 — the standard
# TLS trust store override).
#
# The MREVIEW_CA_BUNDLE_URL variable is set as a masked
# Project-level CI/CD variable (Settings → CI/CD →
# Variables). When unset, this stage writes an empty file
# and the mreview job's SSL_CERT_FILE points at the system
# CAs only — the pipeline degrades gracefully to the
# public-CA-only behaviour.
ca-bundle-sync:
  stage: ca-bundle
  image: curlimages/curl:latest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - mkdir -p "$MREVIEW_ARTIFACTS_DIR"
    - |
      if [ -n "$MREVIEW_CA_BUNDLE_URL" ]; then
        echo "Fetching custom CA bundle from $MREVIEW_CA_BUNDLE_URL"
        # -k on the bootstrap fetch: the bundle URL itself is
        # served by a server whose cert is signed by the CA
        # we're about to download. The first fetch can't be
        # verified against itself; -k is the standard
        # one-time trust bootstrap. Every subsequent TLS
        # call in the pipeline verifies normally via
        # SSL_CERT_FILE.
        curl -fsSLk --retry 3 "$MREVIEW_CA_BUNDLE_URL" \
          -o "$MREVIEW_ARTIFACTS_DIR/ca-bundle.pem"
        head -1 "$MREVIEW_ARTIFACTS_DIR/ca-bundle.pem" \
          | grep -q 'BEGIN CERTIFICATE' || {
            echo "ERROR: bundle is not a PEM file"; exit 1
          }
        echo "CA bundle: $(wc -c < "$MREVIEW_ARTIFACTS_DIR/ca-bundle.pem") bytes"
      else
        echo "MREVIEW_CA_BUNDLE_URL not set; writing empty placeholder"
        : > "$MREVIEW_ARTIFACTS_DIR/ca-bundle.pem"
      fi
  artifacts:
    when: always
    paths:
      - .mreview-artifacts/ca-bundle.pem

# ─── Stage 2: mreview ─────────────────────────────────────────
# Per-event guard (issue #41) lives inside mreview itself,
# not in the YAML's `rules:`. The CI YAML's rules filter
# when mreview is invoked; mreview's internal guard handles
# the rest. See README → "Behaviour by event".
#
# Image selection: the *-debug variant carries a shell
# (/usr/bin/sh resolves via /bin -> usr/bin symlink; busybox
# statically linked against glibc) so the script: block below
# can invoke `mreview review`. The production :latest image is
# distroless with no shell, which fails GitLab Runner with
# `exec: "/bin/sh": not found` on script: blocks.
mreview:
  stage: review
  image: ghcr.io/inful/mreview:latest-debug
  variables:
    LLM_URL: http://localhost:11434/v1
    LLM_MODEL: qwen2.5-coder:7b
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  needs:
    - go-build
    - go-test
    - golangci-lint
    - govulncheck
    - tokensave-sync
    - ca-bundle-sync
  before_script:
    # Concatenate the system CAs (in the mreview image at the
    # standard Debian path) with the internal CA bundle
    # (from the ca-bundle-sync artifact). When MREVIEW_CA_BUNDLE_URL
    # was unset, the bundle file is empty and cat is a no-op
    # — SSL_CERT_FILE points at the system CAs only and
    # public services still verify.
    - cat /etc/ssl/certs/ca-certificates.crt "$MREVIEW_ARTIFACTS_DIR/ca-bundle.pem" > /tmp/combined.pem
    - export SSL_CERT_FILE=/tmp/combined.pem
    - echo "SSL_CERT_FILE=$SSL_CERT_FILE ($(wc -c < $SSL_CERT_FILE) bytes)"
  script:
    - mreview review
        --repo-id="$CI_PROJECT_ID"
        --mr="$CI_MERGE_REQUEST_IID"
        --gitlab-url="$CI_API_V4_URL"
        --gitlab-token="$GITLAB_TOKEN_CI"
        --provider=local
        --provider-base-url="$LLM_URL"
        --model="$LLM_MODEL"
        --workdir="$CI_PROJECT_DIR"
        --artifacts-dir="$MREVIEW_ARTIFACTS_DIR"
        --log-format=json
  allow_failure: true
  tags:
    - docker

# Surface the bot's MR URL in the pipeline output so the
# developer can click through to the review from the
# pipeline view.
mreview-summary:
  stage: review
  image: alpine:3
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - echo "Review posted to $CI_MERGE_REQUEST_PROJECT_URL/-/merge_requests/$CI_MERGE_REQUEST_IID"
  needs:
    - mreview
