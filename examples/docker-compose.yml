# Local development companion: runs Ollama with a code-review-tuned
# model so a developer can run `mreview review` against their own
# repo on a workstation.
#
# Post-#42 architecture note: mreview is CI-only — it does not run
# as a long-lived daemon. This compose file deliberately does NOT
# include an `mreview` service. To exercise the bot locally, point
# the workstation invocation at this Ollama instance:
#
#   GITLAB_TOKEN=glpat-... \
#   mreview review \
#     --repo=group/project --mr=42 \
#     --provider=local \
#     --provider-base-url=http://localhost:11434/v1 \
#     --workdir=$PWD \
#     --log-format=json
#
# For CI-driven review, use examples/central-ci.yml instead — it
# owns the producer stages + the mreview stage in one pipeline.
#
# Usage:
#
#   1. Start:
#        docker compose up -d
#
#   2. Pull a model (one-time):
#        docker compose exec ollama ollama pull qwen2.5-coder:7b
#
#   3. Run `mreview review` from your host shell against the
#      Ollama service above. The host's `mreview` binary is
#      installed via `go install github.com/inful/mreview/cmd/mreview@latest`
#      or pulled from the release artifacts.
#
#   4. Watch the Ollama logs:
#        docker compose logs -f ollama

services:
  ollama:
    image: ollama/ollama:latest
    container_name: mreview-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      # ollama serve returns 200 on / once the server is up.
      test: ["CMD-SHELL", "test -f /root/.ollama/id || curl -fsS http://localhost:11434/ || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  ollama-data:
    # Persists pulled models across container restarts.
    # `docker compose down -v` removes it.